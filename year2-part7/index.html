function renderHome(){var content='<section class="hero"><div><div class="kicker">English Year 2 · Part 7</div><h1>One picture. One great sentence.</h1><p>Look carefully, write what happened, add an adjective and find one more detail. Your practice saves as you type.</p></div><div class="hero-emoji">🖼️✏️</div></section><div class="title-row"><div><h2>Choose a writing task</h2><div class="muted tiny">4 guided drills + 2 practice-exam Part 7 questions</div></div><span class="tag">6 tasks · 18 pictures</span></div><div class="cards">';

function renderDrill(){var a=DATA.find(function(x){return x.id===state.activity;})||DATA[0];var r=getRec(a.id);var n=countAnswered(r);var h='<button class="back" data-nav="home">← All drills</button><section class="paper-head"><div class="paper-meta"><span class="tag">'+esc(a.type)+'</span><span class="tag">Part 7 · 15 marks</span></div><h1>'+esc(a.title)+'</h1><p>'+esc(a.prompt)+' Use the words given to complete the message.</p><div class="toolbar"><div class="mode"><button data-mode="guided" class="'+(state.mode==='guided'?'selected':'')+'">💡 Guided</button><button data-mode="exam" class="'+(state.mode==='exam'?'selected':'')+'">📝 Exam mode</button></div><button class="btn secondary small" id="toggle-model">'+(state.showModel?'Hide':'Show')+' sample answers</button><button class="btn secondary small" id="toggle-mark">✓ '+(state.marking?'Hide':'Show')+' marking</button><span class="stats" id="written-count">'+n+'/3 pictures written</span></div><div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:'+(n*100/3)+'%"></div></div></section><section class="letter-intro"><p><b>Dear '+esc(a.to)+',</b></p><p>'+esc(a.intro)+'</p></section><div class="sequence">';

function renderProgress(){var list=DATA.map(function(a){var r=getRec(a.id);return {a:a,r:r,n:countAnswered(r)};});var c=list.reduce(function(n,x){return n+x.n;},0);var h='<section class="hero"><div><div class="kicker">Your work</div><h1>Little steps, big progress.</h1><p>'+esc(saved.person.name||'Guest')+' has written '+c+' of 18 picture responses on this device.</p></div><div class="hero-emoji">📚</div></section><div class="title-row"><h2>Writing progress</h2><span class="tag">'+c+'/18 pictures</span></div><div class="cards">';list.forEach(function(x){h+='<article class="card"><div class="card-body"><span class="tag">'+esc(x.a.type)+'</span><h3>'+esc(x.a.title)+'</h3><div class="progress-track"><div class="progress-fill" style="width:'+(x.n/3*100)+'%"></div></div><p style="margin-top:9px">'+x.n+'/3 completed · Teacher score '+totalMarks(x.r)+'/15</p><div class="bottom"><button data-open="'+x.a.id+'" class="btn primary small">'+(x.n?'Continue':'Start')+' →</button></div></div></article>';});return h+'</div>';}
function renderTeacher(){var recs=Object.keys(saved.records).map(function(k){return saved.records[k];}).filter(function(r){return r.answers.some(function(x){return x.trim();});});recs.sort(function(a,b){return (b.updated||'').localeCompare(a.updated||'');});var h='<section class="hero"><div><div class="kicker">Teacher area</div><h1>Review, mark and export.</h1><p>Open any task, choose “Show marking”, and award 5 marks per picture. Export records before clearing device data.</p></div><div class="hero-emoji">🧑‍🏫</div></section><div class="tips"><h3>Marking guide</h3><div class="tips-inline"><span class="tip">Punctuation: 1</span><span class="tip">Grammar: 0–2</span><span class="tip">Adjective: 1</span><span class="tip">Extra detail with/without conjunction: 1</span><span class="tip">3 pictures = 15 marks</span></div><p class="tiny muted">A single well-developed sentence or two related sentences can both earn full marks. Read pupil responses before awarding scores. Suggested answers are examples only.</p><button class="btn primary" id="export-csv">↓ Export all saved work (CSV)</button></div><div class="title-row"><h2>Saved pupil responses</h2><span class="tag">'+recs.length+' saved task(s)</span></div>';

function render(){navUpdate();app.innerHTML=state.page==='drill'?renderDrill():state.page==='progress'?renderProgress():state.page==='teacher'?renderTeacher():renderHome();}
function openDrill(id){state.activity=id;state.page='drill';state.showModel=false;state.marking=false;render();window.scrollTo(0,0);}
function exportTxt(){var a=DATA.find(function(x){return x.id===state.activity;});var r=getRec(a.id);var s='YEAR 2 ENGLISH – PART 7\n'+a.title+'\nPupil: '+(saved.person.name||'Guest')+'\nClass: '+(saved.person.cls||'')+'\n\nDear '+a.to+',\n'+a.intro+'\n\n'+r.answers.map(function(x,i){return ['First, ','Next, ','Then, '][i]+x;}).join('\n\n')+'\n\nYour friend,\n'+a.from+'\n\nTeacher score: '+totalMarks(r)+'/15';saveDownload('year2-'+a.id+'-'+(saved.person.name||'guest').replace(/[^a-z0-9]/gi,'-')+'.txt',s,'text/plain;charset=utf-8');}
function saveDownload(name,content,type){var b=new Blob([content],{type:type});var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},700);}
function csvEscape(x){var s=String(x==null?'':x);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){var rows=[['Pupil','Class','Drill','Picture','Pupil response','Punctuation (1)','Grammar (2)','Adjective (1)','Extra detail (1)','Picture score (5)','Task score (15)','Saved at']];Object.keys(saved.records).forEach(function(k){var r=saved.records[k],a=DATA.find(function(x){return x.id===r.id;});if(!a||!r.answers.some(function(v){return v.trim();}))return;r.answers.forEach(function(v,i){var m=r.marks[i]||{p:0,g:0,a:0,d:0};rows.push([r.name,r.cls,a.title,i+1,v,m.p,m.g,m.a,m.d,picMarks(m),totalMarks(r),r.updated]);});});saveDownload('year2-part7-results.csv','\ufeff'+rows.map(function(row){return row.map(csvEscape).join(',');}).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported.');}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
