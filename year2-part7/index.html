function blackWhiteCartoon(markup){
  // Convert each original colour vector scene to printable monochrome line art.
  function ink(hex){
    var n=hex.slice(1),r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
    var l=.2126*r+.7152*g+.0722*b;
    return l<105?'#171717':l<145?'#ededed':'#ffffff';
  }
  markup=markup.replace(/fill="(#[0-9a-fA-F]{6})"/g,function(m,col){return 'fill="'+ink(col)+'"'});
  markup=markup.replace(/stroke="#[0-9a-fA-F]{6}"/g,'stroke="#191919"');
  markup=markup.replace(/<(rect|path|circle|ellipse|polygon)([^>]*?)>/g,function(m,tag,attrs){
    if(/fill="#(?:ffffff|ededed|171717)"/i.test(attrs)&&!/\sstroke=/.test(attrs)){
      if(tag==='rect'&&/width="320"\s+height="212"/.test(attrs))return m;
      return '<'+tag+attrs.replace(/\/\s*$/,'')+' stroke="#191919" stroke-width="1.65"/>';
    }
    return m;
  });
  markup=markup.replace(/<text\b([^>]*)fill="(?:#ffffff|#ededed|#171717)"/g,function(m,a){return '<text'+a+'fill="#171717"'});
  return markup;
}

if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
render();loadBoard();if(state.code)login(state.code);
