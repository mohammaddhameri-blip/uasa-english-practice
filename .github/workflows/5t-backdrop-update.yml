name: Deploy selected 5T Jamuan backdrop
on:
  push:
    paths:
      - .github/workflows/5t-backdrop-update.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the selected poster from Canva media storage
        shell: bash
        run: |
          set -u
          urls=(
          - 'https://media.canva.com/v2/image-resize/format:PNG/height:1080/quality:100/uri:ifs%3A%2F%2FM%2F17cb7abe-4158-41ff-9c5f-6c10f235fe7c/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAJRemHIJk6yBbtMTH6g0MaMkMjm0MXS-YJkimf0gC-HI&exp=1795428707&osig=AAAAAAAAAAAAAAAAAAAAAGT8yTr98dYOIpI1NyT9E7IZHFqF78Wvlr8mh6e_sQsh&signer=media-rpc&token=AAIAAU0AJDE3Y2I3YWJlLTQxNTgtNDFmZi05YzVmLTZjMTBmMjM1ZmU3YwAAAAABogfj6rgDD1jlsvzHT4APIHGRlJfM4bLestqNAg4O8Zp4L1te_A&x-canva-quality=high'
          - 'https://media.canva.com/v2/image-resize/format:PNG/height:1080/quality:100/uri:ifs%3A%2F%2FM%2F17cb7abe-4158-41ff-9c5f-6c10f235fe7c/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAJRemHIJk6yBbtMTH6g0MaMkMjm0MXS-YJkimf0gC-HI&exp=1795428707&osig=AAAAAAAAAAAAAAAAAAAAAGT8yTr98dYOIpI1NyT9E7IZHFqF78Wvlr8mh6e_sQsh&signer=media-rpc&token=AAIAAU0AJDE3Y2I3YWJlLTQxNTgtNDFmZi05YzVmLTZjMTBmMjM1ZmU3YwAAAAABogfj6rgDD1jlsvzHT4APIHGRlJfM4bLestqNAg4O8Zp4L1te_A&x-canva-quality=thumbnail'
          - 'https://media.canva.com/v2/image-resize/format:PNG/quality:100/uri:ifs%3A%2F%2FM%2F17cb7abe-4158-41ff-9c5f-6c10f235fe7c/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAJRemHIJk6yBbtMTH6g0MaMkMjm0MXS-YJkimf0gC-HI&exp=1795428707&osig=AAAAAAAAAAAAAAAAAAAAAGT8yTr98dYOIpI1NyT9E7IZHFqF78Wvlr8mh6e_sQsh&signer=media-rpc&token=AAIAAU0AJDE3Y2I3YWJlLTQxNTgtNDFmZi05YzVmLTZjMTBmMjM1ZmU3YwAAAAABogfj6rgDD1jlsvzHT4APIHGRlJfM4bLestqNAg4O8Zp4L1te_A&x-canva-quality=thumbnail'
          - 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F17cb7abe-4158-41ff-9c5f-6c10f235fe7c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJRemHIJk6yBbtMTH6g0MaMkMjm0MXS-YJkimf0gC-HI&exp=1795428707&osig=AAAAAAAAAAAAAAAAAAAAAGT8yTr98dYOIpI1NyT9E7IZHFqF78Wvlr8mh6e_sQsh&signer=media-rpc&token=AAIAAU0AJDE3Y2I3YWJlLTQxNTgtNDFmZi05YzVmLTZjMTBmMjM1ZmU3YwAAAAABogfj6rgDD1jlsvzHT4APIHGRlJfM4bLestqNAg4O8Zp4L1te_A&x-canva-quality=thumbnail'
          )
          largest=0
          selected=""
          i=0
          for url in "${urls[@]}"; do
            echo "Checking media candidate $i"
            if curl -fLsS --max-time 40 "$url" -o "/tmp/candidate-$i.png"; then
              dimensions=$(identify -format '%w %h' "/tmp/candidate-$i.png" 2>/dev/null || echo "0 0")
              read -r width height <<< "$dimensions"
              echo "Candidate $i: ${width}x${height}"
              if (( width > largest )); then largest=$width; selected="/tmp/candidate-$i.png"; fi
            else echo "Candidate $i unavailable"; fi
            i=$((i+1))
          done
          if (( largest < 720 )); then
            echo "::error::High-resolution version not provided by media server. Retaining existing asset."
            exit 1
          fi
          convert "$selected" -resize 1920x1080 -background white -gravity center -extent 1920x1080 -strip -quality 90 uasa-5t-display/jamuan-5-terbilang.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uasa-5t-display/jamuan-5-terbilang.jpg
          git commit -m "Replace 5T Jamuan backdrop with chosen illustrated poster" || true
          git push
