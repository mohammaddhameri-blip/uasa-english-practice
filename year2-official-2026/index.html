const score=(answers)=>{const vals={};for(let p=1;p<=6;p++)vals[p]=0;for(const [n,key] of Object.entries(KEY_MC))if(String(answers[n]||'').trim().toUpperCase()===key)vals[PARTS.find(p=>+n>=p.range[0]&&+n<=p.range[1]).n]++;

if(p===3)return `<div class="passage"><h3>The Zoo Trip</h3><p>Last Wednesday, Lily went to the zoo with her teacher and classmates. They went there by bus. Lily was very excited because she loves animals. First, they saw the monkeys. They were swinging on the trees. Next, they saw a big elephant. It was drinking water with its long trunk.</p><p>At lunchtime, they sat under a big tree and ate their sandwiches. Lily also had an apple. After lunch, they watched the penguins swim in the water. Lily had a great time and took many photos with her camera.</p></div>${PART3.map(renderChoices).join('')}`;
if(p===4)return `<div class="transport-grid">${[{letter:'A',name:'The Aeroplane',src:'aeroplane',text:'It is very big and can fly high in the sky. It has wings. Many people use it to go on holiday.'},{letter:'B',name:'The Boat',src:'boat',text:'It moves on the water. It can be small or big. You can use it to go across the sea.'},{letter:'C',name:'The Car',src:'car',text:'It has four wheels and moves on the road. You can use it to go to school, work or other places.'}].map(x=>`<div class="transport"><div class="picture"><img src="${IMAGE_URI[x.src]}" alt="${x.name}"></div><div class="copy"><b><span class="alpha">${x.letter}</span> ${x.name}</b><p>${x.text}</p></div></div>`).join('')}</div><div class="note">Example: This transport moves on land. — C</div>${PART4.map(x=>renderChoices({...x,options:['The Aeroplane','The Boat','The Car']})).join('')}`;

if(p===6){const select=n=>`<select data-blank="${n}" class="fill-blank ${state.answers[n]?'filled':''}" aria-label="Blank ${n}"><option value="">(${n}) _____</option>${BANK.map(w=>`<option value="${w}" ${state.answers[n]===w?'selected':''}>${w}</option>`).join('')}</select>`;
return `<p class="muted">Choose the correct words from the word bank to complete Joey’s message to Rachel. Tap a word or use the drop-down in each blank.</p><div class="wordbank">${BANK.map(w=>`<button type="button" class="wordchip" data-chip="${w}">${w}</button>`).join('')}</div><div class="passage"><p>Dear Rachel,</p><p>How are you? Last Sunday, my family and I went to the ${select(26)}. The ${select(27)} was very hot and sunny.</p><p>I played on the ${select(28)} with my brother. We saw many small ${select(29)} on the sand. We had a picnic and ${select(30)} some orange juice. It was a great day!</p><p class="signature">Your friend,<br>Joey</p></div><button class="btn small" id="clearBlanks" type="button">Clear all blanks</button>`}

const INSTRUCTIONS={1:'Questions 1 to 5. Read the text in each question carefully. Choose the correct answer A, B or C.',2:'Questions 6 to 9. Read the text below and choose the correct word for each blank (A, B or C).',3:'Questions 10 to 14. Read the text below and answer the questions that follow (A, B or C).',4:'Questions 15 to 20. Read the texts about transport carefully. Choose transport A, B or C that matches each description.',5:'Questions 21 to 25. Read the animal descriptions. Type the remaining letters of each word. The first letter is already given.',6:'Complete the message to Rachel using the words in the box. Each correct blank is worth 2 marks.',7:'Write a message to Khadijah using the picture prompts and the words given.'};
function renderExam(){if(!state){setView('intro');return}if(state.submittedAt){setView('result');return}const p=PARTS[currentPart-1];state.lastPart=currentPart;saveDraft();const done=progress();app.innerHTML=`<div class="exam-layout"><aside class="sidebar"><div class="panel"><h3>Exam parts</h3><p class="smallprint">${done} of 31 responses completed</p><div class="meter"><div style="width:${done/31*100}%"></div></div>${PARTS.map(s=>`<button type="button" data-part="${s.n}" class="step ${currentPart===s.n?'selected':''} ${partAnswered(s.n)?'done':''}" aria-label="Part ${s.n}: ${s.title}"><span class="step-num">${partAnswered(s.n)?'✓':s.n}</span><span>Part ${s.n}<span class="step-desc" style="display:block">${s.title}</span></span></button>`).join('')}</div></aside><div class="panel"><div class="part-header"><div><p class="eyebrow">Part ${p.n} of 7</p><h1>${escapeHtml(p.title)}</h1><p class="smallprint" style="margin:7px 0 0">${escapeHtml(state.name)} · ${escapeHtml(state.className)}</p></div><span class="marks">${p.marks} marks</span></div><div class="instructions">${escapeHtml(INSTRUCTIONS[p.n])}</div>${renderPart(currentPart)}<div class="nav-bottom"><button type="button" id="prevPart" class="btn" ${currentPart===1?'disabled':''}>← Previous</button><div class="right"><span id="saveBadge" class="smallprint">Automatically saved</span>${currentPart===7?`<button id="submitButton" type="button" class="btn primary">Review &amp; submit ✓</button>`:`<button id="nextPart" type="button" class="btn primary">Next part →</button>`}</div></div></div></div>`;
app.querySelectorAll('[data-part]').forEach(btn=>btn.addEventListener('click',()=>{currentPart=+btn.dataset.part;renderExam();window.scrollTo(0,0)}));
app.querySelectorAll('[data-answer]').forEach(input=>input.addEventListener('change',()=>{state.answers[input.dataset.answer]=input.value;saveDraft();updateSidebarProgress()}));
app.querySelectorAll('[data-word]').forEach(input=>input.addEventListener('input',()=>{input.value=input.value.replace(/[^a-zA-Z]/g,'');state.answers[input.dataset.word]=input.value;saveDraft();updateSidebarProgress()}));
app.querySelectorAll('[data-blank]').forEach(el=>{el.addEventListener('focus',()=>selectedBlank=+el.dataset.blank);el.addEventListener('change',()=>{state.answers[el.dataset.blank]=el.value;saveDraft();el.classList.toggle('filled',!!el.value);updateSidebarProgress()})});
app.querySelectorAll('[data-chip]').forEach(btn=>btn.addEventListener('click',()=>{let n=selectedBlank;const targets=[26,27,28,29,30];if(!targets.includes(n))n=26;const el=app.querySelector(`[data-blank="${n}"]`);el.value=btn.dataset.chip;el.dispatchEvent(new Event('change'));selectedBlank=targets.find(x=>x>n&&!state.answers[x])||targets.find(x=>!state.answers[x])||n;}));
const clear=$('#clearBlanks');if(clear)clear.addEventListener('click',()=>{if(!confirm('Clear all five word blanks in Part 6?'))return;for(let n=26;n<=30;n++)state.answers[n]='';selectedBlank=26;saveDraft();renderExam()});
const wr=$('#freeWriting');if(wr)wr.addEventListener('input',()=>{state.answers[31]=wr.value;saveDraft();updateSidebarProgress()});
const prev=$('#prevPart');prev.addEventListener('click',()=>{currentPart=Math.max(1,currentPart-1);renderExam();window.scrollTo(0,0)});
const next=$('#nextPart');if(next)next.addEventListener('click',()=>{currentPart=Math.min(7,currentPart+1);renderExam();window.scrollTo(0,0)});const submit=$('#submitButton');if(submit)submit.addEventListener('click',()=>submitExam(false));updateTimer();}
function updateSidebarProgress(){const done=progress();const p=app.querySelector('.sidebar .smallprint');if(p)p.textContent=`${done} of 31 responses completed`;const meter=app.querySelector('.meter div');if(meter)meter.style.width=done/31*100+'%';app.querySelectorAll('[data-part]').forEach(b=>{const n=+b.dataset.part;const full=partAnswered(n);b.classList.toggle('done',full);const num=b.querySelector('.step-num');if(num)num.textContent=full?'✓':n});const badge=$('#saveBadge');if(badge)badge.textContent='Saved on this device ✓'}
function submitExam(expired=false){if(!state||state.submittedAt||view!=='exam')return;const missing=[];for(let i=1;i<=31;i++)if(!String(state.answers[i]||'').trim())missing.push(i);if(!expired){const msg=missing.length?`You have ${missing.length} unanswered question${missing.length===1?'':'s'} (${missing.map(x=>x===31?'Part 7':x).join(', ')}).\n\nSubmit your exam anyway? You will not be able to change your answers.`:'Submit your examination? You will not be able to change your answers.';if(!confirm(msg))return}
state.submittedAt=Date.now();state.timedOut=expired;saveDraft();const records=loadRecords();const ix=records.findIndex(x=>x.id===state.id);const record=structuredClone(state);if(ix>=0)records[ix]=record;else records.push(record);storeRecords(records);setView('result');}
function renderResult(){if(!state?.submittedAt){setView('intro');return}const sc=score(state.answers);const record=loadRecords().find(r=>r.id===state.id);const p7=record&&Number.isFinite(record.teacherMark)?record.teacherMark:null;const final=p7===null?null:sc.auto+p7;app.innerHTML=`<div class="panel" style="max-width:850px;margin:auto"><p class="eyebrow">Examination submitted</p><h1 style="margin:0 0 6px">Well done, ${escapeHtml(state.name)}!</h1><p class="muted">${escapeHtml(state.className)} · ${new Date(state.submittedAt).toLocaleString('en-MY')}</p><div class="result-card"><div class="smallprint">${final===null?'Auto-marked score (Parts 1–6)':'Final score (after teacher marking)'}</div><div class="result-score">${final===null?sc.auto+' / 35':final+' / 50'}</div><p style="margin:4px 0 0">${final===null?'Part 7 writing (15 marks) awaits teacher assessment.':'Part 7 has been marked by your teacher.'}</p></div><h2 style="margin-top:24px">Marks by part</h2><div class="results-grid">${PARTS.map(p=>`<div class="result-part">Part ${p.n}<b>${p.n===7?(p7===null?'Pending':p7):sc.parts[p.n]} / ${p.marks}</b></div>`).join('')}</div><p class="note" style="margin-top:20px">This version saves submissions on the device used. To give your teacher your work from another device, use <b>Download submission</b> and send the downloaded JSON file.</p><div class="split-actions" style="margin-top:20px"><button id="downloadSubmission" class="btn primary">↓ Download submission</button><button id="returnHome" class="btn">Home</button><button id="printResult" class="btn">Print result</button></div></div>`;$('#downloadSubmission').addEventListener('click',()=>downloadJSON(state));$('#returnHome').addEventListener('click',()=>setView('intro'));$('#printResult').addEventListener('click',()=>window.print());}
function download(name,contents,type){const blob=new Blob([contents],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function downloadJSON(s){const payload={format:'year2-uasa-official-2026-submission-v1',...s};download(`${s.id}-${s.name.trim().replace(/[^a-z0-9]+/gi,'-').slice(0,40)}.json`,JSON.stringify(payload,null,2),'application/json')}
function cell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function csvRecords(records){const columns=['ID','Name','Class','Started At','Submitted At','Part 1 /5','Part 2 /4','Part 3 /5','Part 4 /6','Part 5 /5','Part 6 /10','Part 7 /15','Total /50','Percentage','Teacher Feedback','Status',...Array.from({length:31},(_,i)=>'Q'+(i+1))];const rows=records.map(r=>{const sc=score(r.answers||{}),m=Number.isFinite(r.teacherMark)?r.teacherMark:null;return[r.id,r.name,r.className,new Date(r.startedAt).toISOString(),new Date(r.submittedAt).toISOString(),...Array.from({length:6},(_,i)=>sc.parts[i+1]),m??'',m===null?'':sc.auto+m,m===null?'':((sc.auto+m)/50*100).toFixed(1)+'%',r.teacherFeedback||'',m===null?'Pending Part 7':'Complete',...Array.from({length:31},(_,i)=>r.answers?.[i+1]||'')]});return '\ufeff'+[columns,...rows].map(line=>line.map(cell).join(',')).join('\r\n')}
function renderTeacher(){const records=loadRecords().filter(r=>r.exam==='year2-uasa-official-2026'&&r.submittedAt);if(!teacherSelected&&records.length)teacherSelected=records[0].id;const selected=records.find(r=>r.id===teacherSelected);const marks=selected?score(selected.answers||{}):null;
app.innerHTML=`<div class="panel"><p class="eyebrow">Teacher tools · local device</p><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap"><div><h1 style="margin:0 0 6px">Submissions &amp; marking</h1><p class="muted" style="margin:0">Import pupil submissions, assess Part 7, and export marks.</p></div><button id="backToIntro" class="btn">← Exam home</button></div><div class="note" style="margin:18px 0"><b>Important:</b> This is a local teacher-review tool, not a secure online collection system. Submissions made on other devices do not appear here until their JSON files are imported.</div><div class="split-actions" style="margin:16px 0 23px"><label class="btn primary" for="importFiles">↑ Import pupil submissions</label><input class="hidden" id="importFiles" type="file" multiple accept=".json,application/json"><button class="btn" id="exportCsv" ${records.length?'':'disabled'}>↓ Export CSV (${records.length})</button><button class="btn" id="exportAllJson" ${records.length?'':'disabled'}>↓ Export records JSON</button></div><div class="teacher-grid"><section><h2>Received (${records.length})</h2>${records.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Class</th><th>Parts 1–6</th><th>Status</th><th></th></tr></thead><tbody>${records.map(r=>{const sc=score(r.answers||{}),marked=Number.isFinite(r.teacherMark);return `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${sc.auto} / 35</td><td>${marked?'Complete':'Part 7 pending'}</td><td><button data-review="${escapeHtml(r.id)}" class="btn small ${r.id===teacherSelected?'primary':''}">Review</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No submitted exams on this device yet. Import pupil JSON submissions to mark them here.</div>'}</section><section>${selected?`<h2>Mark Part 7</h2><p><b>${escapeHtml(selected.name)}</b><br><span class="smallprint">${escapeHtml(selected.className)}</span></p><div class="notice-green"><b>Parts 1–6: ${marks.auto} / 35</b><br>Automatically calculated from the official questions.</div><h3 style="margin-top:20px">Pupil’s answer</h3><div class="passage" style="font-size:1rem;max-height:310px;overflow-y:auto"><p>Dear Khadijah,</p><p>How are you? Last Sunday, my family and I went to the zoo.</p><p style="white-space:pre-wrap">${escapeHtml(selected.answers?.[31]||'(No answer)')}</p><p>Your friend,<br>Amin</p></div><form id="teacherMarkForm"><div class="field"><label for="part7mark">Part 7 mark (out of 15)</label><input type="number" id="part7mark" min="0" max="15" step="1" required placeholder="Enter 0–15" value="${Number.isFinite(selected.teacherMark)?selected.teacherMark:''}"></div><div class="field"><label for="teacherFeedback">Teacher’s notes (optional)</label><textarea id="teacherFeedback" rows="3" placeholder="Feedback for the pupil">${escapeHtml(selected.teacherFeedback||'')}</textarea></div><button class="btn primary" type="submit">Save mark</button></form><div style="margin-top:18px"><b>Final total: ${Number.isFinite(selected.teacherMark)?marks.auto+selected.teacherMark+' / 50':'Pending Part 7'}</b></div><button class="btn small" id="downloadSelected" style="margin-top:14px">↓ Download this submission</button>`:'<h2>Mark Part 7</h2><p class="muted">Select a pupil to review their writing.</p>'}</section></div></div>`;
$('#backToIntro').addEventListener('click',()=>setView('intro'));app.querySelectorAll('[data-review]').forEach(btn=>btn.addEventListener('click',()=>{teacherSelected=btn.dataset.review;renderTeacher()}));
const importEl=$('#importFiles');importEl.addEventListener('change',async e=>{let added=0,invalid=0;const records=loadRecords();for(const file of Array.from(importEl.files)){try{const r=JSON.parse(await file.text());if(r.exam!=='year2-uasa-official-2026'||r.format&&r.format!=='year2-uasa-official-2026-submission-v1'||typeof r.id!=='string'||typeof r.name!=='string'||!r.submittedAt||typeof r.answers!=='object'||r.answers===null){invalid++;continue}const clean={exam:'year2-uasa-official-2026',id:r.id.slice(0,90),name:r.name.slice(0,120),className:String(r.className||'').slice(0,40),startedAt:Number(r.startedAt)||Date.now(),deadline:Number(r.deadline)||Date.now(),submittedAt:Number(r.submittedAt),answers:{},lastPart:7,timedOut:!!r.timedOut};for(let n=1;n<=31;n++)clean.answers[n]=String(r.answers[n]||'').slice(0,n===31?8000:100);const old=records.findIndex(x=>x.id===clean.id);if(old>=0){if(Number.isFinite(records[old].teacherMark)){clean.teacherMark=records[old].teacherMark;clean.teacherFeedback=records[old].teacherFeedback}records[old]=clean}else records.push(clean);added++;teacherSelected=clean.id}catch(err){invalid++}}
storeRecords(records);alert(`${added} submission(s) imported. ${invalid} invalid file(s).`);renderTeacher()});
const ex=$('#exportCsv');if(ex)ex.addEventListener('click',()=>download('Year2-UASA-2026-Marks.csv',csvRecords(records),'text/csv;charset=utf-8'));const exj=$('#exportAllJson');if(exj)exj.addEventListener('click',()=>download('Year2-UASA-2026-Records.json',JSON.stringify(records,null,2),'application/json'));
if(selected){$('#teacherMarkForm').addEventListener('submit',e=>{e.preventDefault();const val=$('#part7mark').value;if(val==='')return;const mark=Number(val);if(!Number.isInteger(mark)||mark<0||mark>15){alert('Part 7 must be a whole mark from 0 to 15.');return}const r=loadRecords(),i=r.findIndex(x=>x.id===selected.id);if(i<0)return;r[i].teacherMark=mark;r[i].teacherFeedback=$('#teacherFeedback').value.trim().slice(0,4000);storeRecords(r);renderTeacher()});$('#downloadSelected').addEventListener('click',()=>downloadJSON(selected))}}
function onHome(){if(view==='exam'){if(!confirm('Return to home? Your answers are saved, but the timer will continue.'))return}setView('intro')}
homeButton.addEventListener('click',onHome);
state=loadDraft();currentPart=state?.lastPart||1;
setView('intro');tickHandle=setInterval(updateTimer,1000);
})();
