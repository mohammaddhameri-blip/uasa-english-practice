}
function boardView(){
 const rows=state.leaders.length?state.leaders.map((p,i)=>'<tr><td class="rank '+(i===0?'first':'')+'">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</td><td><strong>'+clean(p.name)+'</strong><div class="tiny muted">'+clean(p.className)+'</div></td><td><strong>'+p.score+'</strong> / 4,200</td></tr>').join(''):'<tr><td colspan="3" class="muted">No completed homework attempts yet. Be the first to finish!</td></tr>';
 return '<section class="hero"><div><span class="eyebrow">Public leaderboard</span><h1>🏆 Tile 11 Champions</h1><p>Each pupil’s highest completed score counts. Tester scores are excluded.</p></div></section><section class="panel"><div class="row between"><h2>Best completed attempts</h2><div class="row"><button class="btn small light" data-action="refreshBoard">↻ Refresh</button><button class="btn small primary" data-action="closeBoard">← Homework</button></div></div>'+notice()+'<div style="overflow-x:auto"><table class="board"><thead><tr><th>Rank</th><th>Pupil</th><th>Best score</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function progressView(){
 const a=state.attempt;
 const bar='<div class="row between"><div><span class="eyebrow">Hello, '+clean(state.pupil.name)+'! '+(state.pupil.isTester?'(Tester)':'')+'</span><h2 style="margin:5px 0">Your homework progress</h2><div class="tiny muted">'+a.completedStages+' of 42 checks finished · '+a.mistakes+' wrong checks</div></div><div class="col"><span class="tiny muted">Current score</span><span class="score">'+a.score+' / 4,200</span></div></div><div class="progressTrack"><div class="progressFill" style="width:'+(a.completedStages/42*100)+'%"></div></div>';
 const maxR=firstIncomplete(),nav=Array.from({length:7},(_,r)=>'<button class="roundbtn '+(r===state.round?'active ':'')+(allDone(r)?'done ':'')+(r>maxR?'locked':'')+'" data-action="round" data-round="'+r+'" '+(r>maxR?'disabled':'')+' aria-label="Round '+(r+1)+'">'+(allDone(r)?'✓ ': '')+'R'+(r+1)+'</button>').join('');
 return '<section class="panel">'+bar+'<div class="rounds">'+nav+'</div></section>';
}
function questionNav(){
 const r=state.round;
 return '<div class="qTabs">'+[0,1,2].map(s=>'<button class="qTab '+(s===state.source?'active ':'')+(entry(r,s).punctuation?'done':'')+'" data-action="source" data-source="'+s+'">'+(entry(r,s).punctuation?'✓ ':'')+(s+1)+'. '+clean(['Zoo','Picnic','Photos'][s])+'</button>').join('')+'</div>';
}
function orderView(){
 const original=shuffled(state.round,state.source),selected=new Set(state.answerIds),byID=new Map(original.map(o=>[o.id,o]));
 const answer=state.answerIds.map(id=>byID.get(id)).filter(Boolean);
 const tile=t=>'<button class="tile '+t.color+'" data-action="remove" data-id="'+t.id+'" aria-label="Remove '+clean(t.text)+'">'+clean(t.text)+'</button>';
 const bag=original.filter(t=>!selected.has(t.id));
 return '<span class="stepBadge">Step 1 of 2 · Unjumble the words</span><p class="muted tiny">Tap the coloured word tiles to make a sentence.</p><div class="tilebox answer" aria-label="Your arranged sentence">'+(answer.length?answer.map(tile).join(''):'<span class="muted">Your sentence goes here…</span>')+'</div><p class="tiny muted">Words to use</p><div class="tilebox">'+bag.map(t=>'<button class="tile '+t.color+'" data-action="take" data-id="'+t.id+'">'+clean(t.text)+'</button>').join('')+'</div><div class="actions"><button class="btn primary" data-action="checkOrder" '+(bag.length||state.busy?'disabled':'')+'>Check sentence ✓</button><button class="btn light" data-action="clearAnswer">Clear</button></div>';
}
function ensurePunc(){
 if(state.punc)return;
 const e=entry(state.round,state.source);
 state.punc=String(e.orderText||'').split(' ').filter(Boolean).map(w=>({w,comma:false,dot:false}));
 state.selected=0;saveDraft();
}
function punctuationString(){return (state.punc||[]).map(t=>t.w+(t.comma?',':'')+(t.dot?'.':'')).join(' ')}
function punctuationView(){
 ensurePunc();
 const chips=state.punc.map((t,i)=>'<button class="tile punc '+(i===state.selected?'selected':'')+'" data-action="pselect" data-index="'+i+'" aria-pressed="'+(i===state.selected)+'">'+clean(t.w)+(t.comma?'<mark>,</mark>':'')+(t.dot?'<mark>.</mark>':'')+'</button>').join('');
 return '<span class="stepBadge">Step 2 of 2 · Capital letters and punctuation</span><p class="muted tiny">Tap a word. Use ↑ to change the capital letter, , to add a comma, and . to add a full stop.</p><div class="tilebox answer" aria-label="Sentence punctuation editor">'+chips+'</div><div class="puncToolbar"><button class="punctButton" data-action="upper" title="Change capital letter" aria-label="Change capital letter">↑</button><button class="punctButton" data-action="comma" title="Comma" aria-label="Add or remove comma">,</button><button class="punctButton" data-action="period" title="Full stop" aria-label="Add or remove full stop">.</button></div><div class="help">Remember: <strong>First,</strong> <strong>Next,</strong> and <strong>Then,</strong> start with capital letters and commas. End the sentence with a full stop.</div><div class="actions"><button class="btn primary" data-action="checkPunctuation" '+(state.busy?'disabled':'')+'>Check punctuation ✓</button></div>';
}
function completedQuestion(){
 return '<div class="result" style="padding:20px"><div style="font-size:40px">✅</div><h2>Sentence completed!</h2><p class="muted">Both word order and punctuation checks are finished.</p><div class="actions"><button class="btn primary" data-action="nextQuestion">Next question →</button></div></div>';
}
function examView(){
 const q=item(state.round,state.source),stage=currentStage();
 return '<section class="panel"><div class="row between"><div><span class="eyebrow">Round '+(state.round+1)+' / 7</span><h2 style="margin:3px 0">Three-Sentence Challenge</h2></div><span class="tag">3 sentences · 600 points</span></div>'+questionNav()+'<div class="challengeGrid"><div>'+pic(state.round,state.source)+'</div><div class="questionBody"><h3>'+TITLE[state.source]+'</h3>'+ (stage==='done'?completedQuestion():stage==='order'?orderView():punctuationView())+notice()+'</div></div></section><div class="footer">Two checks per sentence · 100 points each · −10 points per incorrect check</div>';
}
function completeView(){
 const score=state.attempt.score,errors=state.attempt.mistakes;
 return '<section class="panel result"><div class="result-icon">🏆</div><span class="eyebrow">Homework completed</span><h2>Well done, '+clean(state.pupil.name)+'!</h2><div class="big">'+score+' / 4,200</div><p class="muted">21 sentences · 42 completed checks · '+errors+' incorrect checks</p><p>Best completed score: <strong>'+Math.max(score,state.best)+' / 4,200</strong></p><div class="actions"><button class="btn primary" data-action="board">🏆 Leaderboard</button><button class="btn light" data-action="newAttempt">↻ Try again</button></div>'+notice()+'</section>';
}
function render(){
 $('changeCode').hidden=!state.pupil;
 let view=state.board?boardView():!state.pupil?loginView():state.attempt.completedAt?completeView():progressView()+examView();
 $('screen').innerHTML=view;
}
async function check(stage){
 if(state.busy)return;state.busy=true;state.message='Checking your answer…';state.error=false;render();
 try{
  const body={action:'check',code:state.code,attemptId:state.attempt.id,round:state.round,source:state.source,stage};
  if(stage==='order'){
   const all=sourceTiles(state.round,state.source),ids=new Set(state.answerIds);
   if(ids.size!==all.length)throw Error('Use all the word tiles first.');
   body.tokens=state.answerIds.map(id=>all.find(t=>t.id===id)?.text||'');
  } else body.punctuationText=punctuationString();
  const res=await call(body);
  state.attempt=res.attempt;
  state.message=res.passed?'Correct! Well done! 🌟':'Not quite. Check your answer and try again.';
  state.error=!res.passed;
  saveDraft();
  if(res.passed&&state.attempt.completedAt){state.best=Math.max(state.best,state.attempt.score);refreshBoard().catch(()=>{});state.board=false;}
 }catch(e){state.message=e.message;state.error=true}
 finally{state.busy=false;render()}
}
async function newAttempt(){
 if(state.busy)return;state.busy=true;state.message='Starting a new attempt…';render();
 try{
  const x=await call({action:'newAttempt',code:state.code});
  state.attempt=x.attempt;state.round=0;state.source=0;state.message='';state.error=false;restore();
 }catch(e){state.message=e.message;state.error=true}
 finally{state.busy=false;render()}
}
function signout(){state.code='';state.pupil=null;state.attempt=null;state.board=false;state.answerIds=[];state.punc=null;state.message='';render()}
document.addEventListener('submit',event=>{
 if(event.target.id==='loginForm'){event.preventDefault();login($('codeInput').value)}
});
document.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action;
 if(action==='board'||action==='refreshBoard'){refreshBoard();return}
 if(action==='closeBoard'){state.board=false;state.message='';render();return}
 if(action==='signout'){signout();return}
 if(action==='newAttempt'){newAttempt();return}
 if(action==='round'){const n=Number(button.dataset.round);goto(n,nextSource(n));return}
 if(action==='source'){goto(state.round,Number(button.dataset.source));return}
 if(action==='nextQuestion'){const n=firstIncomplete();goto(n,nextSource(n));return}
 if(action==='take'){const id=Number(button.dataset.id);if(!state.answerIds.includes(id))state.answerIds.push(id);state.message='';saveDraft();render();return}
 if(action==='remove'){const id=Number(button.dataset.id);state.answerIds=state.answerIds.filter(x=>x!==id);state.message='';saveDraft();render();return}
 if(action==='clearAnswer'){state.answerIds=[];state.message='';saveDraft();render();return}
 if(action==='checkOrder'){check('order');return}
 if(action==='pselect'){state.selected=Number(button.dataset.index);saveDraft();render();return}
 if(action==='upper'||action==='comma'||action==='period'){
  ensurePunc();const t=state.punc[state.selected];if(!t)return;
  if(action==='upper')t.w=t.w.charAt(0)==t.w.charAt(0).toUpperCase()?t.w.charAt(0).toLowerCase()+t.w.slice(1):t.w.charAt(0).toUpperCase()+t.w.slice(1);
  if(action==='comma')t.comma=!t.comma;
  if(action==='period')t.dot=!t.dot;
  state.message='';saveDraft();render();return;
 }
 if(action==='checkPunctuation'){check('punctuation');return}
});
render();
</script></body></html>
